<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <!-- header from the header footer assignment -->
    <!-- === Stylesheet & Font & Normalize === -->
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="normalize.css">

  <!-- === Favicon === -->
  <link rel="icon" href="images /Logo.jpeg" />
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header>
    <!-- === Logo Section === -->
    <div class="logo">
      <img src="images /Logo.jpeg"HomeEase Logo" />
      <div class="brand-text">
        <h1>HomeEase</h1>
        <p>Essential Home Supplies</p>
      </div>
    </div>
    
    <!-- === Navigation Bar === -->
    <nav class="nav">
      <a href="#" class="active"><img src="icons/home.png" alt="Home icon" /> Home</a>
      <a href="#"><img src="icons/box.png" alt="Products icon" /> Products</a>
      <a href="#"><img src="icons/information.png" alt="About icon" /> About</a>
      <a href="#"><img src="icons/telephone.png" alt="Contact icon" /> Contact</a>
    </nav>

    <!-- === Header Actions === -->

    <div class="actions">
      <!-- Search Bar -->
      <div class="search">
        <input type="text" placeholder="Search products..." />
      </div>

      <div class="lang">
        <img src="icons/internet.png" alt="Language" class="icon-22" />
        <select class="lang-select">
          <option value="en">EN</option>
          <option value="fr">FR</option>
        </select>
      </div>

      <!-- Shopping Cart -->
      <img src="icons/shopping-cart.png" alt="Shopping Cart" class="icon" />

      <!-- Login Button -->
      <div class="login">
        <img src="icons/user.png" alt="User" />
        <span>Log in</span>
      </div>
    </div>
  </header>

    <!-- End of the header footer assignment -->

    <h1>Contact</h1>
    <p>Address</p>
    <p>phone</p>
    <p>email</p>
</head>
<body>
    
</body>
</html>
